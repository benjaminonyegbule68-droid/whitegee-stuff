<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0f14">
  <meta name="description" content="Sign in to your Northstar Investments account.">
  <title>Sign in — Northstar Investments</title>
  <link rel="stylesheet" href="public/styles.css">
</head>

<body class="portal-page">
  <main class="auth">
    <a class="brand" href="index.html" aria-label="Northstar Investments home">
      NORTHSTAR <span>INVESTMENTS</span>
    </a>

    <section class="auth-card" aria-labelledby="page-title">
      <p class="eyebrow">Account access</p>
      <h1 id="page-title">Sign in</h1>
      <p>
        Enter your credentials to open your portfolio dashboard.
      </p>

      <form action="dashboard.html" method="get" style="margin-top: 22px;">
        <div class="form-group">
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="username"
            placeholder="you@example.com"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="••••••••"
            required
          >
        </div>

        <button class="button button-full" type="submit">
          Sign in
        </button>
      </form>

      <div style="margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--border-soft);">
        <p style="margin-bottom: 6px;">New to Northstar?</p>
        <a href="register.html">Create an account →</a>
      </div>
    </section>

    <p class="muted" style="text-align: center; font-size: 0.82rem; margin-top: 20px;">
      <a href="trust.html">Trust Center</a>
      &nbsp;·&nbsp;
      <a href="index.html">Home</a>
    </p>
  </main>
</body>
</html>
